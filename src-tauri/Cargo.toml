[package]
name = "art-net-studio"
version = "0.1.0"
description = "Art-Net Studio —— Art-Net / sACN 灯光控制与录制平台"
authors = ["Art-Net Studio"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "art_net_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "art-net-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = { workspace = true }

artrec-core = { path = "crates/artrec-core" }
recorder = { path = "crates/recorder" }
player = { path = "crates/player" }
artnet-net = { path = "crates/artnet-net" }
signal-engine = { path = "crates/signal-engine" }
discovery = { path = "crates/discovery" }
forwarding = { path = "crates/forwarding" }
esp32-link = { path = "crates/esp32-link" }
settings = { path = "crates/settings" }
if-addrs = { workspace = true }

[workspace]
members = ["crates/*"]

[workspace.package]
edition = "2021"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
crc = "3"
zstd = "0.14"
byteorder = "1"
artnet_protocol = "0.4"
calamine = "0.37"
if-addrs = "0.15"
socket2 = "0.5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
