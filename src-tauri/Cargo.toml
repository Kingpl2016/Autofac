[package]
name = "art-net-studio"
version = "0.1.0"
description = "Art-Net Studio —— Art-Net / sACN 灯光控制与录制平台"
authors = ["Art-Net Studio"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "art_net_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "art-net-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-upload = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

# 桌面专用插件：全局快捷键 / 持久化文件授权范围 / 自动更新。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-persisted-scope = "2"
tauri-plugin-updater = "2"

# 领域/运行时逻辑已迁入各插件 crate；应用壳只直接依赖回放命令与控制器桥接所需的少数 crate。
artrec-core = { path = "crates/artrec-core" }
recorder = { path = "crates/recorder" }
player = { path = "crates/player" }
controller = { path = "crates/controller" }
host-core = { path = "crates/host-core" }

[workspace]
members = ["crates/*"]

[workspace.package]
edition = "2021"
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
anyhow = "1"
tracing = { version = "0.1", features = ["log"] }
crc = "3"
zstd = "0.14"
# `log` 特性：无 tracing 订阅者时把 tracing 事件转为 `log` 记录，交由 tauri-plugin-log 统一处理。
byteorder = "1"
artnet_protocol = "0.4"
calamine = "0.37"
if-addrs = "0.15"
socket2 = "0.5"
bytes = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
