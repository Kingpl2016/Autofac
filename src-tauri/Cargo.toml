[package]
name = "art-net-studio"
version = "0.1.0"
description = "Art-Net Studio —— Art-Net / sACN 灯光控制与录制平台"
authors = ["Art-Net Studio"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "art_net_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "art-net-studio"
path = "src/main.rs"

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# 导出 TypeScript 绑定（仅生成类型时开启）。
ts = ["dep:ts-rs", "recorder/ts", "player/ts", "netdev/ts", "host-core/ts", "signal-gen/ts", "netif/ts", "settings/ts", "show-engine/ts"]
[dependencies]
# 由 DTO 生成前端 TypeScript 类型（仅 `ts` feature；见根目录 package.json 的 gen:types）。
ts-rs = { workspace = true, optional = true }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-upload = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

# 桌面专用插件：全局快捷键 / 持久化文件授权范围 / 自动更新。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-persisted-scope = "2"
tauri-plugin-updater = "2"

# 领域/运行时逻辑已迁入各插件 crate；应用壳只直接依赖回放命令与网络设备桥接所需的少数 crate。
artrec-core = { path = "crates/artrec-core" }
recorder = { path = "crates/recorder" }
player = { path = "crates/player" }
netdev = { path = "crates/netdev" }
host-core = { path = "crates/host-core" }
# 信号检测器：测试信号发生器核心与目标地址候选（网卡 / 广播地址）。
signal-gen = { path = "crates/signal-gen" }
netif = { path = "crates/netif" }
settings = { path = "crates/settings" }
# 节目编辑引擎：灯具物模型 / Excel 导入 / 工程求值与烘焙。
show-engine = { path = "crates/show-engine" }
# 原子文件写入（写临时文件 + fsync + rename）。
fsutil = { path = "crates/fsutil" }
# 系统“文档”目录定位（旧版录制目录迁移用）。
dirs = { workspace = true }
# 预览引擎 30 FPS 计时线程的高精度等待（与 host-core 回放线程相同）。
spin_sleep = { workspace = true }
# 互斥锁（与各 crate 一致，不毒化）。
parking_lot = { workspace = true }

[workspace]
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.90"

# 全 workspace 统一的 lint 策略：各 crate 用 `[lints] workspace = true` 继承。
# pedantic 置 warn（priority = -1，让下方各 allow 覆盖其中的单项）。
# 以下 allow 均为本项目领域内的已知噪音项，统一放开：
# - doc_markdown：中文文档里的英文术语会被误判需反引号；
# - cast_*：DMX / 协议字节大量使用语义明确的 as 窄化转换；
# - module_name_repetitions：领域类型名常与模块同名（如 `fixture::FixtureModel`）；
# - too_many_lines：协议 / 恢复流程等线性长函数拆开反而难读；
# - must_use_candidate / needless_pass_by_value：Tauri 命令普遍按值收 `AppHandle` / `State`。
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
anyhow = "1"
tracing = { version = "0.1", features = ["log"] }
crc = "3"
zstd = "0.14"
artnet_protocol = "0.4"
calamine = "0.37"
if-addrs = "0.15"
# 系统已知文件夹（“文档”等）定位，正确处理 OneDrive / XDG 重定向。
dirs = "=7.0.0"
# 测试用临时目录 / 文件（仅 dev-dependencies）。
tempfile = "=3.27.0"
socket2 = "0.5"
bytes = "1"
# 由 Rust DTO 生成前端 TypeScript 类型：各 crate 以可选依赖 + `ts` feature 引入，
# 只在 `cargo test --all-features export_bindings` 时导出到 `src/bindings`，不进发布产物。
ts-rs = "=12.0.1"
# 性能基准（仅 dev-dependencies 使用）：带分配计数的微基准框架。
divan = "=0.1.21"
# 小键（u16 / IpAddr / 序号）哈希表：FxHash 比默认 SipHash 快；键均来自本机内部，无 HashDoS 风险。
rustc-hash = "=2.1.3"
# 读多写少的共享数据（编译后的转发路由、发送器、帧旁路接收器）的无锁读取。
arc-swap = "=1.9.3"
# 互斥锁：不毒化（持锁线程 panic 后仍可取用），比 std 更快更小，正合实时链路语义。
parking_lot = "=0.12.5"
# 概览矩阵的标准 Base64 编解码（前端 JSON / sidecar 用）。
base64 = "=0.22.1"
# 节目概览 / 通道曲线的并行扫描（专用线程池）。
rayon = "=1.12.0"
# 回放线程的高精度等待（Windows 原生 sleep 精度不足 1ms）。
spin_sleep = "=1.3.3"

# 运行速度优先（见 Rust Performance Book「Build Configuration」）：
# 收包 / 合并 / 编解码热路径依赖内联与向量化，`opt-level = "s"` 会抑制两者。
[profile.release]
panic = "abort"
codegen-units = 1
lto = "fat"
opt-level = 3
strip = true

# 前端预览用的 WebAssembly 引擎（scripts/build-wasm.mjs）：体积优先，在浏览器里下载与编译更快。
[profile.wasm]
inherits = "release"
opt-level = "s"

# 采样分析（samply / WPA）用：与 release 相同的优化，保留符号与调试信息。
# 用法：`cargo build --profile profiling`
[profile.profiling]
inherits = "release"
debug = true
strip = false
