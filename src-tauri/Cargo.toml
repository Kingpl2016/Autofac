[package]
name = "art-net-studio"
version = "0.1.0"
description = "Art-Net Studio —— Art-Net / sACN 灯光控制与录制平台"
authors = ["Art-Net Studio"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "art_net_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "art-net-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-upload = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

# 桌面专用插件：全局快捷键 / 持久化文件授权范围 / 自动更新。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-persisted-scope = "2"
tauri-plugin-updater = "2"

# 领域/运行时逻辑已迁入各插件 crate；应用壳只直接依赖回放命令与控制器桥接所需的少数 crate。
artrec-core = { path = "crates/artrec-core" }
recorder = { path = "crates/recorder" }
player = { path = "crates/player" }
controller = { path = "crates/controller" }
host-core = { path = "crates/host-core" }
# 信号检测器：测试信号发生器核心与目标地址候选（网卡 / 广播地址）。
signal-gen = { path = "crates/signal-gen" }
netif = { path = "crates/netif" }
settings = { path = "crates/settings" }

[workspace]
members = ["crates/*"]

[workspace.package]
edition = "2021"
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
anyhow = "1"
tracing = { version = "0.1", features = ["log"] }
crc = "3"
zstd = "0.14"
byteorder = "1"
artnet_protocol = "0.4"
calamine = "0.37"
if-addrs = "0.15"
socket2 = "0.5"
bytes = "1"
# 性能基准（仅 dev-dependencies 使用）：带分配计数的微基准框架。
divan = "=0.1.21"
# 小键（u16 / IpAddr / 序号）哈希表：FxHash 比默认 SipHash 快；键均来自本机内部，无 HashDoS 风险。
rustc-hash = "=2.1.3"
# 读多写少的共享数据（编译后的转发路由、发送器、帧旁路接收器）的无锁读取。
arc-swap = "=1.9.3"
# 节目概览 / 通道曲线的并行扫描（专用线程池）。
rayon = "=1.12.0"
# 回放线程的高精度等待（Windows 原生 sleep 精度不足 1ms）。
spin_sleep = "=1.3.3"

# 运行速度优先（见 Rust Performance Book「Build Configuration」）：
# 收包 / 合并 / 编解码热路径依赖内联与向量化，`opt-level = "s"` 会抑制两者。
[profile.release]
panic = "abort"
codegen-units = 1
lto = "fat"
opt-level = 3
strip = true

# 采样分析（samply / WPA）用：与 release 相同的优化，保留符号与调试信息。
# 用法：`cargo build --profile profiling`
[profile.profiling]
inherits = "release"
debug = true
strip = false
