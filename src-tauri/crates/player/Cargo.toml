[package]
name = "player"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "ArtRec 回放核心：时间驱动的帧调度、seek、保活，以及时间线概览与通道曲线分析（纯逻辑，无 IO / Tauri 依赖）"

[lints.clippy]
pedantic = "warn"
# 领域专有名词（ArtRec/DMX/Universe/Zstd 等）无需反引号，关闭噪音项
doc_markdown = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
module_name_repetitions = "allow"

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
artrec-core = { path = "../artrec-core" }

[dev-dependencies]
serde_json = { workspace = true }
