[package]
name = "settings"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "应用配置模型、持久化与校验（网络/协议/显示/合并/录制/更新）"

[lints]
workspace = true

[features]
# 导出 TypeScript 绑定（仅生成类型时开启）。
ts = ["dep:ts-rs", "signal-engine/ts"]
[dependencies]
# 由 DTO 生成前端 TypeScript 类型（仅 `ts` feature；见根目录 package.json 的 gen:types）。
ts-rs = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
signal-engine = { path = "../signal-engine" }
fsutil = { path = "../fsutil" }
