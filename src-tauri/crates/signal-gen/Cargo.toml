[package]
name = "signal-gen"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "测试信号发生器：15 种图案渲染、配置校验、手动数据与 44Hz UDP 发送器"
[lints]
workspace = true
[features]
# 导出 TypeScript 绑定（仅生成类型时开启）。
ts = ["dep:ts-rs", "artnet-net/ts", "forwarding/ts"]
[dependencies]
# 由 DTO 生成前端 TypeScript 类型（仅 `ts` feature；见根目录 package.json 的 gen:types）。
ts-rs = { workspace = true, optional = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
artnet-net = { path = "../artnet-net" }
forwarding = { path = "../forwarding" }
parking_lot = { workspace = true }
[dev-dependencies]
serde_json = { workspace = true }
