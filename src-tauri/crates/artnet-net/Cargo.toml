[package]
name = "artnet-net"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Art-Net 4 与 sACN (E1.31) 数据包编解码及 UDP 收发"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
artnet_protocol = { workspace = true }
socket2 = { workspace = true }
bytes = { workspace = true }

[dev-dependencies]
divan = { workspace = true }

# 编解码微基准（divan，带分配计数）。
[[bench]]
name = "codec"
harness = false

# Art-Net / sACN 压测发包程序（仅 std）；test = true 使 `cargo test` 运行其回环自测。
[[example]]
name = "loadgen"
test = true
