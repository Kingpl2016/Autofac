[package]
name = "ai-gateway"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "AI 模型网关：厂商配置（JSON 持久化）、API Key（系统凭据管理器）、带主机白名单与密钥注入的流式 HTTP 代理、对话记录读写"

[lints]
workspace = true

[features]
# 导出 TypeScript 绑定（仅生成类型时开启）。
ts = ["dep:ts-rs"]

[dependencies]
# 由 DTO 生成前端 TypeScript 类型（仅 `ts` feature；见根目录 package.json 的 gen:types）。
ts-rs = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
fsutil = { path = "../fsutil" }
# 与 tauri-plugin-updater 共用同一版本与 TLS 栈（rustls + ring 加密后端），不额外编译第二套 TLS。
# system-proxy：跟随系统代理设置（访问境外模型接口时常用）。
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "stream", "http2", "system-proxy"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
url = "=2.5.8"
futures-util = "=0.3.34"
tokio-util = { version = "=0.7.20" }
uuid = { version = "=1.29.0", features = ["v4"] }
keyring = { version = "=4.2.0" }

[dev-dependencies]
wiremock = "=0.6.5"
tempfile = { workspace = true }
