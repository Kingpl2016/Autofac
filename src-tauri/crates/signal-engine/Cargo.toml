[package]
name = "signal-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "DMX 接收管线：Universe 状态、多源合并（HTP/LTP/Priority）、源超时与统计"

[lints]
workspace = true

[features]
# 导出 TypeScript 绑定（仅生成类型时开启）。
ts = ["dep:ts-rs", "artnet-net/ts"]
[dependencies]
# 由 DTO 生成前端 TypeScript 类型（仅 `ts` feature；见根目录 package.json 的 gen:types）。
ts-rs = { workspace = true, optional = true }
serde = { workspace = true }
artnet-net = { path = "../artnet-net" }
# 速率追踪的计数器表（键为 `Copy` 小键，FxHash 比默认 SipHash 快）。
rustc-hash = { workspace = true }

[dev-dependencies]
divan = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }

# 引擎热路径微基准（摄取 / 合并 / 快照 / 速率 / 来源统计）。
[[bench]]
name = "engine"
harness = false

# 推送载荷 JSON 序列化成本与体积基准。
[[bench]]
name = "payload"
harness = false
