[package]
name = "mcp-hub"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "AI 助手的 MCP 客户端：服务器配置（JSON 持久化）、命令指纹确认、stdio / Streamable HTTP 连接、工具列表与带超时 / 大小上限的工具调用"

[lints]
workspace = true

[features]
# 导出 TypeScript 绑定（仅生成类型时开启）。
ts = ["dep:ts-rs"]

[dependencies]
ts-rs = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
fsutil = { path = "../fsutil" }
# 凭据存储（系统凭据管理器）与 AI 配置共用。
ai-gateway = { path = "../ai-gateway" }
# MCP 官方 Rust SDK：只开客户端、子进程（stdio）与 Streamable HTTP 客户端；TLS 用 rustls 且不带默认加密后端
# （与 ai-gateway 共用 ring 后端）。
rmcp = { version = "=3.8.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }
url = "=2.5.8"

[dev-dependencies]
tempfile = { workspace = true }
