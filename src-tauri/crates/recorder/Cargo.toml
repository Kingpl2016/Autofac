[package]
name = "recorder"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "ArtRec 录制核心：来源过滤、变更检测、差分/全量帧策略、崩溃安全落盘（纯逻辑，无 Tauri 依赖）"

[lints.clippy]
pedantic = "warn"
# 领域专有名词（ArtRec/DMX/Universe/Zstd 等）无需反引号，关闭噪音项
doc_markdown = "allow"
cast_possible_truncation = "allow"
module_name_repetitions = "allow"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
artrec-core = { path = "../artrec-core" }
artnet-net = { path = "../artnet-net" }
signal-engine = { path = "../signal-engine" }
trash = { version = "=5.2.9", default-features = false, features = ["coinit_apartmentthreaded"] }

[dev-dependencies]
# 带分配计数的微基准框架（仅 benches 使用）。
divan = { workspace = true }

# 节目库列表与 sidecar 读取微基准：`cargo bench -p recorder --bench library`。
[[bench]]
name = "library"
harness = false

# 录制 tick 路径（摄入 + 变更检测 + 编码压缩写出）微基准：`cargo bench -p recorder --bench session`。
[[bench]]
name = "session"
harness = false
