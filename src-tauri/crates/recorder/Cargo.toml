[package]
name = "recorder"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "ArtRec 录制核心：来源过滤、变更检测、差分/全量帧策略、崩溃安全落盘（纯逻辑，无 Tauri 依赖）"

[lints]
workspace = true

[features]
# 导出 TypeScript 绑定（仅生成类型时开启）。
ts = ["dep:ts-rs", "artnet-net/ts", "signal-engine/ts"]
[dependencies]
# 由 DTO 生成前端 TypeScript 类型（仅 `ts` feature；见根目录 package.json 的 gen:types）。
ts-rs = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
artrec-core = { path = "../artrec-core" }
artnet-net = { path = "../artnet-net" }
signal-engine = { path = "../signal-engine" }
fsutil = { path = "../fsutil" }
parking_lot = { workspace = true }
trash = { version = "=5.2.9", default-features = false, features = ["coinit_apartmentthreaded"] }

[dev-dependencies]
# 带分配计数的微基准框架（仅 benches 使用）。
divan = { workspace = true }

# 节目库列表与 sidecar 读取微基准：`cargo bench -p recorder --bench library`。
[[bench]]
name = "library"
harness = false

# 录制 tick 路径（摄入 + 变更检测 + 编码压缩写出）微基准：`cargo bench -p recorder --bench session`。
[[bench]]
name = "session"
harness = false
