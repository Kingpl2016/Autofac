[package]
name = "discovery"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "网络设备发现：Art-Net 节点回复合并、被动源识别、分类与自定义名"

[lints]
workspace = true

[features]
# 导出 TypeScript 绑定（仅生成类型时开启）。
ts = ["dep:ts-rs", "artnet-net/ts"]
[dependencies]
# 由 DTO 生成前端 TypeScript 类型（仅 `ts` feature；见根目录 package.json 的 gen:types）。
ts-rs = { workspace = true, optional = true }
serde = { workspace = true }
artnet-net = { path = "../artnet-net" }

[dev-dependencies]
serde_json = { workspace = true }
divan = { workspace = true }

# 设备注册表微基准（列表克隆 / 离线标记 / 被动发现 / JSON 序列化）。
[[bench]]
name = "registry"
harness = false
