[package]
name = "netif"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "本机网络接口枚举与 Art-Net 广播目标计算"

[lints]
workspace = true

[features]
# 导出 TypeScript 绑定（仅生成类型时开启）。
ts = ["dep:ts-rs"]
[dependencies]
# 由 DTO 生成前端 TypeScript 类型（仅 `ts` feature；见根目录 package.json 的 gen:types）。
ts-rs = { workspace = true, optional = true }
serde = { workspace = true }
if-addrs = { workspace = true }
