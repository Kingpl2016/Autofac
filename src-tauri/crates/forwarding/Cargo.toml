[package]
name = "forwarding"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "信号转发：目的地路由、per-universe 覆盖、偏移/延迟、范围记法与 44Hz 限速"

[lints]
workspace = true

[features]
# 导出 TypeScript 绑定（仅生成类型时开启）。
ts = ["dep:ts-rs"]
[dependencies]
# 由 DTO 生成前端 TypeScript 类型（仅 `ts` feature；见根目录 package.json 的 gen:types）。
ts-rs = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
