[package]
name = "host-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "核心插件：应用配置 + 信号引擎 + 设备发现 + 转发 + 录制/回放控制器，经 ArtnetCoreExt / SettingsExt 暴露"

[lints]
workspace = true

[features]
# 导出 TypeScript 绑定（仅生成类型时开启）。
ts = ["dep:ts-rs", "artnet-net/ts", "signal-engine/ts", "discovery/ts", "forwarding/ts", "settings/ts", "recorder/ts", "player/ts", "netif/ts"]
[dependencies]
# 由 DTO 生成前端 TypeScript 类型（仅 `ts` feature；见根目录 package.json 的 gen:types）。
ts-rs = { workspace = true, optional = true }
tauri = { version = "2", features = [] }
artnet-net = { path = "../artnet-net" }
signal-engine = { path = "../signal-engine" }
discovery = { path = "../discovery" }
forwarding = { path = "../forwarding" }
settings = { path = "../settings" }
recorder = { path = "../recorder" }
player = { path = "../player" }
artrec-core = { path = "../artrec-core" }
netif = { path = "../netif" }
fsutil = { path = "../fsutil" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
fs4 = "=1.1.0"
memory-stats = "=1.2.0"
bytes = { workspace = true }
rustc-hash = { workspace = true }
arc-swap = { workspace = true }
parking_lot = { workspace = true }
spin_sleep = { workspace = true }

[dev-dependencies]
# 带分配计数的微基准框架（仅 benches 使用）。
divan = { workspace = true }

# 输出分发路由解析微基准：`cargo bench -p host-core --bench dispatch`。
[[bench]]
name = "dispatch"
harness = false

# 实时摄取流水线微基准：`cargo bench -p host-core --bench pipeline`。
[[bench]]
name = "pipeline"
harness = false

# 二进制 DMX 通道流微基准（帧编码 / 变化检测）：`cargo bench -p host-core --bench stream`。
[[bench]]
name = "stream"
harness = false
